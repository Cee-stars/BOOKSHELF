<style>
:root{
  --ink:#12131A;
  --ink-2:#1B1D27;
  --ink-3:#262936;
  --paper:#FFFFFF;
  --text:#F2F3F7;
  --dim:#9AA0B4;
  --line:rgba(255,255,255,.10);

  --g-fantasy:#00B87C;
  --g-sf:#00C2FF;
  --g-mystery:#7B4BFF;
  --g-romance:#FF3E8A;
  --g-horror:#E63946;
  --g-adventure:#F2B705;
  --g-history:#C98A3B;
  --g-business:#FF7A18;
  --g-self:#FF9F1C;
  --g-science:#1FC9C3;
  --g-kids:#A8E10C;
  --g-essay:#FF6B6B;
  --g-other:#8892A6;

  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--ui);
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- 共通ヘッダー ---------- */
.bar{
  flex:0 0 auto;padding:calc(var(--safe-t) + 14px) 16px 12px;
  display:flex;align-items:center;gap:10px;
  background:var(--ink);border-bottom:1px solid var(--line);
}
.bar h1{
  margin:0;font-family:var(--display);font-size:22px;letter-spacing:.06em;
  font-weight:800;
}
.bar .count{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.spacer{flex:1}
.iconbtn{
  width:40px;height:40px;border-radius:12px;background:var(--ink-3);
  display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--text);
}
.iconbtn:active{transform:scale(.94)}
.textbtn{padding:9px 14px;border-radius:999px;background:var(--ink-3);font-size:14px;font-weight:700}

/* ---------- 棚 ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tools{padding:12px 16px 4px}
.search{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--ink-2);font-size:16px;
}
.search::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--ink-3);color:var(--dim);white-space:nowrap;border:1.5px solid transparent;
}
.chip[data-on="1"]{color:#fff}
.list{padding:0 16px calc(120px + var(--safe-b))}

.card{
  display:flex;align-items:stretch;gap:0;margin-bottom:12px;
  background:var(--ink-2);border-radius:16px;overflow:hidden;
  border:1px solid var(--line);position:relative;
}
.card:active{transform:scale(.99)}
.spine{
  flex:0 0 36px;background:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:800;line-height:1;color:rgba(0,0,0,.68);
  padding:10px 2px;overflow:hidden;
}
.spine span{display:block}
.spine span.rot{transform:rotate(90deg)}
.card .body{flex:1;min-width:0;padding:14px 14px 12px;text-align:left}
.card .t{
  font-family:var(--display);font-size:17px;font-weight:800;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card .a{margin-top:3px;font-size:13px;color:var(--dim)}
.card .m{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em}
.track{margin-top:9px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:99px}
.more{
  flex:0 0 44px;display:grid;place-items:center;color:var(--dim);font-size:20px;
  border-left:1px solid var(--line);
}
.empty{padding:56px 24px;text-align:center;color:var(--dim);line-height:1.9}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--text);margin-bottom:10px}

.fab{
  position:fixed;right:18px;bottom:calc(20px + var(--safe-b));
  height:56px;padding:0 22px;border-radius:999px;background:var(--g-business);
  color:#12131A;font-family:var(--display);font-weight:900;font-size:17px;
  box-shadow:0 10px 26px rgba(255,122,24,.34);display:flex;align-items:center;gap:8px;
}
.fab:active{transform:scale(.96)}

/* ---------- 追加・編集 ---------- */
.form{padding:16px 16px calc(40px + var(--safe-b));max-width:720px;margin:0 auto;width:100%}
.label{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--dim);margin:18px 0 8px}
.label:first-child{margin-top:4px}
.input,.area{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--ink-2);font-size:16px;line-height:1.6;
}
.area{min-height:220px;resize:vertical;font-family:var(--serif)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  padding:9px 13px;border-radius:999px;background:var(--ink-3);font-size:13px;font-weight:700;
  color:var(--dim);border:1.5px solid transparent;
}
.pill[data-on="1"]{color:#12131A}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:11px;border:2.5px solid transparent}
.sw[data-on="1"]{border-color:#fff}
.hint{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:8px}
.primary{
  width:100%;margin-top:26px;padding:16px;border-radius:16px;background:var(--g-business);
  color:#12131A;font-family:var(--display);font-size:17px;font-weight:900;
}
.danger{width:100%;margin-top:12px;padding:14px;border-radius:16px;background:rgba(230,57,70,.14);color:#FF7C85;font-weight:800}
.ghost{width:100%;margin-top:12px;padding:14px;border-radius:16px;background:var(--ink-3);font-weight:800}

/* ---------- リーダー ---------- */
#reader{background:var(--rb,#12131A);color:var(--rt,#F2F3F7)}
#reader .bar{background:transparent;border-bottom-color:rgba(128,128,128,.18)}
#reader .iconbtn{background:rgba(128,128,128,.16);color:inherit}
.rtitle{font-family:var(--display);font-size:14px;font-weight:800;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;max-width:52vw}
.page{
  padding:24px 22px calc(150px + var(--safe-b));max-width:760px;margin:0 auto;width:100%;
  font-family:var(--serif);
  font-size:var(--fs,19px);line-height:var(--lh,1.85);
}
.page h2{
  font-family:var(--display);font-size:15px;letter-spacing:.14em;font-weight:800;
  color:var(--c,#FF7A18);margin:0 0 22px;text-transform:uppercase;
}
.page p{margin:0 0 1.15em;text-align:left;word-break:normal;overflow-wrap:break-word;hyphens:auto}
.foot{
  position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--rb,#12131A) 62%,transparent);
  display:flex;align-items:center;gap:10px;
}
.foot .nav{
  flex:0 0 auto;padding:13px 18px;border-radius:14px;background:rgba(128,128,128,.18);
  font-weight:800;font-size:15px;
}
.foot .nav[disabled]{opacity:.3}
.foot .pos{flex:1;text-align:center;font-family:var(--mono);font-size:11.5px;opacity:.7}
.rprog{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(128,128,128,.2)}
.rprog i{display:block;height:100%;background:var(--c,#FF7A18)}

/* ---------- 文字装飾 ---------- */
.mk{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mk[data-hl="1"]{--fg-red:#C62828;--fg-blue:#1565C0;color:#16171C;padding:.06em 0}
.mk[data-b="1"]{font-weight:800}
.mk[data-fg="red"]{color:var(--fg-red,#E5484D)}
.mk[data-fg="blue"]{color:var(--fg-blue,#3B82F6)}

.stylebar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
  padding:12px 14px calc(12px + var(--safe-b));
  background:var(--ink-2);color:var(--text);font-family:var(--ui);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 34px rgba(0,0,0,.42);
  user-select:none;-webkit-user-select:none;
}
.stylebar.on{display:block}
.sbrow{display:flex;align-items:center;gap:8px}
.sbrow + .sbrow{margin-top:10px}
.sblabel{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin:12px 0 8px}
.sbtn{
  padding:10px 13px;border-radius:12px;background:var(--ink-3);
  font-weight:800;font-size:14px;color:var(--text);border:1.5px solid transparent;
}
.sbtn:active{transform:scale(.94)}

</style>

<!-- ============ 棚 ============ -->

<!-- ============ シート ============ -->
<div class="sheet" id="sheetAa"><div class="inner">
  <h3>表示設定</h3>
  <div class="sline"><span class="k">文字の大きさ</span><div class="stepper">
    <button data-fs="-1">小さく −</button><button data-fs="1">大きく ＋</button></div></div>

  <button class="ghost" data-close="1">閉じる</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============ ジャンル定義 ============ */
const GENRES = [
  {id:"fantasy",  name:"ファンタジー", c:"#00B87C", kw:["wizard","magic","dragon","elf","sword","spell","kingdom","witch","quest","prophecy","sorcer","enchant","goblin","mage","realm","castle"]},
  {id:"sf",       name:"SF",          c:"#00C2FF", kw:["space","robot","alien","galaxy","planet","spaceship","android","cyber","laser","starship","quantum","colony","mars","orbit","artificial intelligence"]},
  {id:"mystery",  name:"ミステリー",   c:"#7B4BFF", kw:["murder","detective","clue","suspect","inspector","crime","victim","alibi","investigat","police","mystery","witness","sergeant","evidence"]},
  {id:"romance",  name:"ロマンス",     c:"#FF3E8A", kw:["love","kiss","romance","marry","wedding","boyfriend","girlfriend","darling","passion","dating","affair","heart"]},
  {id:"horror",   name:"ホラー",       c:"#E63946", kw:["ghost","terror","haunted","scream","monster","nightmare","demon","curse","evil","vampire","zombie","blood"]},
  {id:"adventure",name:"冒険",         c:"#F2B705", kw:["island","treasure","journey","voyage","jungle","captain","sail","adventure","expedition","escape","mountain","desert"]},
  {id:"history",  name:"歴史",         c:"#C98A3B", kw:["king","queen","empire","century","battle","army","revolution","ancient","dynasty","soldier","treaty","medieval"]},
  {id:"business", name:"ビジネス",     c:"#FF7A18", kw:["business","market","company","customer","profit","strategy","manage","invest","startup","brand","sales","leadership","revenue"]},
  {id:"self",     name:"自己啓発",     c:"#FF9F1C", kw:["habit","mindset","success","motivation","goal","productiv","focus","discipline","confidence","routine","willpower"]},
  {id:"science",  name:"科学",         c:"#1FC9C3", kw:["cell","energy","theory","experiment","research","brain","evolution","atom","species","physics","chemical","climate","neuron"]},
  {id:"kids",     name:"児童書",       c:"#A8E10C", kw:["bunny","teddy","puppy","kitten","mummy","daddy","playground","fairy","once upon a time","little bear","toy"]},
  {id:"essay",    name:"エッセイ",     c:"#FF6B6B", kw:["i remember","my father","my mother","memoir","childhood","diary","essay","when i was"]},
  {id:"other",    name:"その他",       c:"#8892A6", kw:[]}
];
const G = Object.fromEntries(GENRES.map(g=>[g.id,g]));
const PALETTE = ["#FF7A18","#FF3E8A","#7B4BFF","#00C2FF","#00B87C","#A8E10C","#F2B705","#E63946","#1FC9C3","#FF9F1C","#C98A3B","#8892A6"];

/* ============ 保存 (IndexedDB) ============ */
const DB = (()=>{
  let p=null;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      const r = indexedDB.open("bookshelf",1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("books",{keyPath:"id"}); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
    return p;
  }
  const tx = (mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t = db.transaction("books",mode);
    const s = t.objectStore("books");
    const req = fn(s);
    t.oncomplete = ()=>res(req && req.result);
    t.onerror = ()=>rej(t.error);
  }));
  return {
    all: ()=>tx("readonly",s=>s.getAll()),
    put: b=>tx("readwrite",s=>s.put(b)),
    del: id=>tx("readwrite",s=>s.delete(id)),
  };
})();

/* ============ 状態 ============ */
let books = [];
let filter = "all";
let query = "";
let cur = null;      // 読書中の本
let parts = [];      // 分割した本文
let partIdx = 0;
let editingId = null;
let moreId = null;

const S = {
  fs: +(localStorage.getItem("fs")||19),
  lh: +(localStorage.getItem("lh")||1.85),
  th: localStorage.getItem("th")||"night"
};
/* 紙の色 20 種類。本ごとに選べる（既存の night / paper / sepia は残してある） */
const THEMES = {
  paper:   {n:"紙",       bg:"#FFFFFF", tx:"#16171C"},
  cream:   {n:"クリーム", bg:"#FFF8E7", tx:"#2E2A22"},
  ivory:   {n:"アイボリー",bg:"#FAF4E6", tx:"#33302A"},
  sepia:   {n:"セピア",   bg:"#F6ECD8", tx:"#3A2E1E"},
  linen:   {n:"リネン",   bg:"#F4EFE6", tx:"#322E28"},
  sand:    {n:"サンド",   bg:"#EFE3D0", tx:"#3A3227"},
  kraft:   {n:"クラフト", bg:"#E8D9BE", tx:"#3B3023"},
  mint:    {n:"ミント",   bg:"#E6F2EA", tx:"#1E2E25"},
  moss:    {n:"モス",     bg:"#E4EADC", tx:"#262E22"},
  sky:     {n:"スカイ",   bg:"#E7F0F8", tx:"#1D2833"},
  lavender:{n:"ラベンダー",bg:"#EFEAF6", tx:"#2A2434"},
  rose:    {n:"ローズ",   bg:"#FBEDEF", tx:"#33262A"},
  gray:    {n:"グレー",   bg:"#ECEDEF", tx:"#23262B"},
  slate:   {n:"スレート", bg:"#DFE3E8", tx:"#1F242B"},
  dusk:    {n:"夕暮れ",   bg:"#1B1F2A", tx:"#E4E8F2"},
  night:   {n:"夜",       bg:"#12131A", tx:"#F2F3F7"},
  carbon:  {n:"カーボン", bg:"#16181C", tx:"#E8EAEE"},
  ink:     {n:"墨",       bg:"#0C0D12", tx:"#DDE1EA"},
  navy:    {n:"ネイビー", bg:"#101A2B", tx:"#DCE6F5"},
  forest:  {n:"フォレスト",bg:"#121C18", tx:"#DCEAE2"}
};
const THEME_IDS = Object.keys(THEMES);
// 明るさで判定する（20 色あるので名前では判断しない）
function isDark(hex){
  const c=hex.replace("#","");
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 128;
}

const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const words = t=>{const m=(t||"").trim().match(/[A-Za-z0-9'’\-]+/g);return m?m.length:0;};

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._id); t._id=setTimeout(()=>t.classList.remove("on"),1600);
}
function show(id){
  $$(".view").forEach(v=>v.classList.toggle("on",v.id===id));
  window.scrollTo(0,0);
}

/* ============ ジャンル自動判定 ============ */
function detectGenre(title,text){
  const src = ((title||"")+" "+(text||"").slice(0,20000)).toLowerCase();
  if(!src.trim()) return "other";
  let best="other", bestScore=0;
  for(const g of GENRES){
    if(!g.kw.length) continue;
    let n=0;
    for(const k of g.kw){
      const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");
      const m = src.match(re);
      if(m) n += Math.min(m.length,12);
    }
    const score = n / Math.sqrt(g.kw.length);
    if(score>bestScore){bestScore=score;best=g.id;}
  }
  return bestScore>=2 ? best : "other";
}

/* ============ 本文の分割 ============ */
const HEAD = /^(chapter|chap\.?|part|prologue|epilogue|book|section)\b[\s.:—-]*[0-9ivxlcdm]*\.?\s*$/i;
const HEAD2 = /^(chapter|part|prologue|epilogue)\b/i;

function splitParts(text){
  const paras = (text||"").replace(/\r/g,"").split(/\n\s*\n+/)
    .map(s=>s.trim()).filter(Boolean);
  if(!paras.length) return [{title:"本文",paras:["（本文がありません）"]}];

  const heads = paras.filter(p=>p.length<70 && (HEAD.test(p)||HEAD2.test(p)));
  let out=[];
  if(heads.length>=2){
    let curP=null;
    paras.forEach((p,i)=>{
      const isH = p.length<70 && (HEAD.test(p)||HEAD2.test(p));
      if(isH || !curP){
        curP={title:isH?p:"はじめ",paras:[]};
        out.push(curP);
        if(isH) return;
      }
      curP.paras.push(p);
    });
  }else{
    out=[{title:"",paras:paras.slice()}];
  }
  // 長すぎるパートはさらに分ける（表示を軽くするため）
  const LIMIT=1400, res=[];
  for(const p of out){
    let buf=[],n=0,seg=0;
    for(const t of p.paras){
      buf.push(t); n+=words(t);
      if(n>=LIMIT){
        seg++;
        res.push({title:p.title?(seg>1?p.title+" ("+seg+")":p.title):"",paras:buf});
        buf=[];n=0;
      }
    }
    if(buf.length){
      seg++;
      res.push({title:p.title?(seg>1?p.title+" ("+seg+")":p.title):"",paras:buf});
    }
  }
  return res.map((p,i)=>({title:p.title||("パート "+(i+1)),paras:p.paras}));
}

/* ============ 棚を描く ============ */
function renderChips(){
  const used = new Set(books.map(b=>b.genre));
  const el=$("#chips"); el.innerHTML="";
  const mk=(id,name,c)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=name;
    if(filter===id){b.dataset.on="1";b.style.background=c;b.style.borderColor=c;}
    b.onclick=()=>{filter=id;renderChips();renderList();};
    el.appendChild(b);
  };
  mk("all","すべて","#FF7A18");
  GENRES.filter(g=>used.has(g.id)).forEach(g=>mk(g.id,g.name,g.c));
}

function renderList(){
  const el=$("#list"); el.innerHTML="";
  let arr=books.slice().sort((a,b)=>(b.lastRead||b.created)-(a.lastRead||a.created));
  if(filter!=="all") arr=arr.filter(b=>b.genre===filter);
  if(query){
    const q=query.toLowerCase();
    arr=arr.filter(b=>(b.title+" "+(b.author||"")).toLowerCase().includes(q));
  }
  $("#count").textContent = books.length ? books.length+" BOOKS" : "";

  if(!arr.length){
    el.innerHTML='<div class="empty"><b>'+(books.length?"見つかりませんでした":"棚はまだ空です")+'</b>'+
      (books.length?"検索とジャンルを変えてみてください。":"右下の「＋ 本を追加」から本文を貼り付けます。")+'</div>';
    return;
  }
  for(const b of arr){
    const g=G[b.genre]||G.other;
    const c=b.color||g.c;
    const pct=Math.round((b.progress||0)*100);
    const card=document.createElement("div");
    card.className="card"; card.style.setProperty("--c",c);
    card.innerHTML =
      '<div class="spine"></div>'+
      '<button class="body"><div class="t"></div><div class="a"></div>'+
      '<div class="m"></div><div class="track"><i style="width:'+pct+'%"></i></div></button>'+
      '<button class="more" aria-label="メニュー">⋯</button>';
    const sp=card.querySelector(".spine");
    for(const ch of g.name){
      const s=document.createElement("span");
      s.textContent=ch;
      if(/[ー－—–-]/.test(ch)) s.className="rot";
      sp.appendChild(s);
    }
    card.querySelector(".t").textContent=b.title;
    card.querySelector(".a").textContent=b.author||"";
    if(!b.author) card.querySelector(".a").style.display="none";
    const wc=b.words||0;
    card.querySelector(".m").textContent =
      wc.toLocaleString()+" words · 約"+Math.max(1,Math.round(wc/150))+"分 · "+pct+"%";
    card.querySelector(".body").onclick=()=>openBook(b.id);
    card.querySelector(".more").onclick=e=>{e.stopPropagation();openMore(b.id);};
    el.appendChild(card);
  }
}

/* ============ 追加・編集 ============ */
let fGenre=null, fColor=null, autoG="other";

function renderGenrePills(){
  const el=$("#genres"); el.innerHTML="";
  GENRES.forEach(g=>{
    const b=document.createElement("button");
    b.className="pill"; b.textContent=g.name;
    if((fGenre||autoG)===g.id){b.dataset.on="1";b.style.background=g.c;}
    b.onclick=()=>{fGenre=g.id;renderGenrePills();renderColors();};
    el.appendChild(b);
  });
  $("#autoTag").textContent = fGenre?"":"自動判定："+G[autoG].name;
}
function renderColors(){
  const el=$("#colors"); el.innerHTML="";
  const gid=fGenre||autoG;
  const list=[G[gid].c,...PALETTE.filter(c=>c!==G[gid].c)];
  list.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="sw"; b.style.background=c;
    if((fColor||G[gid].c)===c) b.dataset.on="1";
    b.onclick=()=>{fColor=c;renderColors();};
    el.appendChild(b);
  });
}
function updateStat(){
  const t=$("#fText").value;
  const w=words(t);
  $("#stat").textContent = w.toLocaleString()+" 語 / "+t.length.toLocaleString()+" 文字 · 読了目安 約"+Math.max(1,Math.round(w/150))+"分";
  if(!fGenre){ autoG=detectGenre($("#fTitle").value,t); renderGenrePills(); renderColors(); }
}
function openEditor(id){
  editingId=id||null; fGenre=null; fColor=null;
  const b = id ? books.find(x=>x.id===id) : null;
  $("#editTitle").textContent = b?"本を編集":"本を追加";
  $("#fTitle").value = b?b.title:"";
  $("#fAuthor").value = b?(b.author||""):"";
  $("#fText").value = b?b.text:"";

}
async function saveBook(){
  const title=$("#fTitle").value.trim();
  const text=$("#fText").value;
  if(!title){ toast("タイトルを入れてください"); $("#fTitle").focus(); return; }
  if(!text.trim()){ toast("本文を入れてください"); $("#fText").focus(); return; }
  const old = editingId ? books.find(b=>b.id===editingId) : null;
  const b = {
    id: editingId || (Date.now()+"-"+Math.random().toString(36).slice(2,7)),
    title, author:$("#fAuthor").value.trim(),
    text,
    genre: fGenre || autoG,
    color: fColor || null,
    words: words(text),
    created: old?old.created:Date.now(),
    lastRead: old?old.lastRead:0,
    progress: old?(old.text===text?old.progress:0):0,
    part: old?(old.text===text?old.part:0):0,
    // 本文が変わると文字位置がずれるので、そのときだけ装飾を捨てる
    marks: (old && old.text===text && old.marks) ? old.marks : {},
    theme: (old && old.theme) || null      // 背景の紙は本文を変えても保つ
  };
  await DB.put(b);
  books = books.filter(x=>x.id!==b.id); books.push(b);
  renderChips(); renderList(); show("shelf");

async function openBook(id){
  cur = books.find(b=>b.id===id);
  if(!cur) return;
  parts = splitParts(cur.text);
  // 装飾を段落単位で覚えるための通し番号（パートの区切りが変わってもずれにくい）
  let base=0;
  parts.forEach(p=>{ p.base=base; base+=p.paras.length; });
  if(!cur.marks || typeof cur.marks!=="object") cur.marks={};
  partIdx = Math.min(cur.part||0, parts.length-1);
  const c = cur.color || (G[cur.genre]||G.other).c;
  $("#reader").style.setProperty("--c",c);
  $("#rTitle").textContent = cur.title;
  applyReaderStyle();

function drawPart(toTop=true){

  page.appendChild(h);
  p.paras.forEach((t,j)=>{
    const el=document.createElement("p");
    el.dataset.gi = (p.base||0)+j;
    paintPara(el,t);
    page.appendChild(el);
  });
  hideStyleBar();
  $("#pos").textContent = (partIdx+1)+" / "+parts.length;
  $("#prev").disabled = partIdx===0;
  $("#next").disabled = partIdx===parts.length-1;
  const prog=(partIdx+1)/parts.length;
  $("#rbar").style.width=(prog*100)+"%";
  $("#rScroll").scrollTop=0;
  saveProgress(prog);
}
let saveTimer=null;
function saveProgress(prog){
  if(!cur) return;
  cur.part=partIdx; cur.progress=prog; cur.lastRead=Date.now();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>DB.put(cur).catch(()=>{}),400);
}
function move(d){
  const n=partIdx+d;
  if(n<0||n>=parts.length) return;
  partIdx=n; drawPart(true);
}
function renderToc(){
  const el=$("#toc"); el.innerHTML="";
  parts.forEach((p,i)=>{
    const b=document.createElement("button");
    b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>';
    b.appendChild(document.createTextNode(p.title));
    if(i===partIdx) b.dataset.on="1";
    b.onclick=()=>{partIdx=i;drawPart(true);closeSheets();};
    el.appendChild(b);

}

/* ============ 文字装飾 ============ */
/* 背景色 20 色（どれも明るめ。上に黒・赤・青の文字をのせても読める） */
const HILITE = [
  {c:"#FFF176",n:"イエロー"},   {c:"#FFD54F",n:"アンバー"},
  {c:"#FFB74D",n:"オレンジ"},   {c:"#FFAB91",n:"サーモン"},
  {c:"#FF8A80",n:"レッド"},     {c:"#F48FB1",n:"ピンク"},
  {c:"#F06292",n:"ローズ"},     {c:"#E1BEE7",n:"ラベンダー"},
  {c:"#CE93D8",n:"パープル"},   {c:"#B39DDB",n:"バイオレット"},
  {c:"#9FA8DA",n:"インディゴ"}, {c:"#90CAF9",n:"ブルー"},
  {c:"#81D4FA",n:"スカイ"},     {c:"#80DEEA",n:"シアン"},
  {c:"#80CBC4",n:"ティール"},   {c:"#A5D6A7",n:"グリーン"},
  {c:"#C5E1A5",n:"リーフ"},     {c:"#E6EE9C",n:"ライム"},
  {c:"#D7CCC8",n:"ブラウン"},   {c:"#CFD8DC",n:"グレー"}
];

let selTargets = [];   // [{gi,s,e}] いま選んでいる範囲（段落ごと）
let barLock = false;   // ツールバー操作中は選択解除で閉じない
let selTimer = null, markTimer = null;

/* --- 段落の描画（装飾つき） --- */
function paintPara(el,text){
  const runs = (cur && cur.marks && cur.marks[el.dataset.gi]) || [];
  const L = text.length;
  el.textContent = "";
  let pos = 0;
  for(const r of runs){
    const s = Math.max(0,Math.min(L,r.s|0)), e = Math.max(0,Math.min(L,r.e|0));
    if(e<=s || s<pos) continue;                       // 壊れた範囲は読み飛ばす
    if(s>pos) el.appendChild(document.createTextNode(text.slice(pos,s)));
    const sp = document.createElement("span");
    sp.className = "mk";
    if(r.bg){ sp.style.background = r.bg; sp.dataset.hl = "1"; }
    if(r.bold) sp.dataset.b = "1";
    if(r.fg) sp.dataset.fg = r.fg;
    sp.textContent = text.slice(s,e);
    el.appendChild(sp);
    pos = e;
  }
  if(pos<L) el.appendChild(document.createTextNode(text.slice(pos)));
}
function repaint(gis){
  gis.forEach(gi=>{
    const el = $('#page p[data-gi="'+gi+'"]');
    if(el) paintPara(el, el.textContent);
  });
}

/* --- 範囲の足し引き（重なっても崩れないように区間で持つ） --- */
function splitAt(runs,x){
  const out=[];
  for(const r of runs){
    if(r.s<x && x<r.e){ out.push({...r,e:x},{...r,s:x}); }
    else out.push(r);
  }
  return out;
}
function applyRange(runs,s,e,patch){
  if(e<=s) return runs;
  const cut = splitAt(splitAt(runs.map(r=>({...r})),s),e).sort((a,b)=>a.s-b.s);
  const inside = cut.filter(r=>r.s>=s && r.e<=e);
  const outside = cut.filter(r=>!(r.s>=s && r.e<=e));
  const target=[]; let pos=s;
  for(const r of inside){                              // 装飾のない隙間を埋める
    if(r.s>pos) target.push({s:pos,e:r.s,bg:null,bold:0,fg:null});
    target.push(r); pos=r.e;
  }
  if(pos<e) target.push({s:pos,e:e,bg:null,bold:0,fg:null});
  target.forEach(r=>Object.assign(r,patch));

  const all = outside.concat(target).sort((a,b)=>a.s-b.s)
    .filter(r=>r.e>r.s && (r.bg||r.bold||r.fg));
  const merged=[];                                     // 同じ装飾が隣り合ったらつなぐ
  for(const r of all){
    const p = merged[merged.length-1];
    if(p && p.e===r.s && p.bg===r.bg && p.bold===r.bold && p.fg===r.fg) p.e=r.e;
    else merged.push(r);
  }
  return merged;
}

/* --- 選択範囲を「段落の通し番号 + 文字位置」に置き換える --- */
function readSel(){
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const page = $("#page");
  if(!page.contains(range.commonAncestorContainer)) return null;
  const out=[];
  $$("#page p[data-gi]").forEach(p=>{
    if(!range.intersectsNode(p)) return;
    const full = document.createRange(); full.selectNodeContents(p);
    const r = range.cloneRange();
    if(r.compareBoundaryPoints(Range.START_TO_START,full)<0) r.setStart(full.startContainer,full.startOffset);
    if(r.compareBoundaryPoints(Range.END_TO_END,full)>0)     r.setEnd(full.endContainer,full.endOffset);
    const head = document.createRange();
    head.setStart(full.startContainer,full.startOffset);
    head.setEnd(r.startContainer,r.startOffset);
    const s = head.toString().length;
    const e = s + r.toString().length;
    if(e>s) out.push({gi:+p.dataset.gi, s, e});
  });
  return out.length?out:null;
}
function posInPara(el,off){
  const w = document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let acc=0,n,last=null;
  while((n=w.nextNode())){
    if(off<=acc+n.nodeValue.length) return {node:n,off:off-acc};
    acc+=n.nodeValue.length; last=n;
  }
  return last?{node:last,off:last.nodeValue.length}:{node:el,off:0};
}
function restoreSel(){
  if(!selTargets.length) return;
  const f=selTargets[0], l=selTargets[selTargets.length-1];
  const pa=$('#page p[data-gi="'+f.gi+'"]'), pb=$('#page p[data-gi="'+l.gi+'"]');
  if(!pa||!pb) return;
  const a=posInPara(pa,f.s), b=posInPara(pb,l.e);
  try{
    const r=document.createRange();
    r.setStart(a.node,a.off); r.setEnd(b.node,b.off);
    const sel=document.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(err){}
}

/* --- 選択範囲がすでにその装飾かどうか（押すたびに入 / 切） --- */
function selHasAll(test){
  if(!selTargets.length) return false;
  return selTargets.every(t=>{
    const runs = ((cur&&cur.marks&&cur.marks[t.gi])||[]).slice().sort((a,b)=>a.s-b.s);
    let pos=t.s;
    for(const r of runs){
      if(r.e<=pos) continue;
      if(r.s>pos || !test(r)) return false;
      pos=r.e;
      if(pos>=t.e) return true;
    }
    return pos>=t.e;
  });
}

/* 装飾・背景など、いま読んでいる本の変更をまとめて保存する */
function saveCur(){
  if(!cur) return;
  clearTimeout(markTimer);
  markTimer = setTimeout(()=>DB.put(cur).catch(()=>toast("保存できませんでした")),300);
}
function applyStyle(patch){
  if(!cur || !selTargets.length) return;
  cur.marks = cur.marks || {};
  for(const t of selTargets){
    const runs = applyRange(cur.marks[t.gi]||[], t.s, t.e, patch);
    if(runs.length) cur.marks[t.gi]=runs; else delete cur.marks[t.gi];
  }
  saveCur();
  repaint(selTargets.map(t=>t.gi));
  restoreSel();
  updateBarState();
}

/* --- ツールバー --- */

function download(name,text,type){
  const blob=new Blob([text],{type:type||"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}

/* ============ 起動 ============ */
(async function init(){
  try{
    books = await DB.all() || [];
  }catch(e){
    books=[]; toast("保存領域を開けませんでした");
  }
  books.forEach(b=>{ if(b.words==null) b.words=words(b.text); });
  renderThemes();
  applyReaderStyle();
  renderChips();
  renderList();
})();
</script>
