<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>BOOKSHELF — 洋書リーダー</title>
<meta name="theme-color" content="#12131A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOOKSHELF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#12131A;
  --ink-2:#1B1D27;
  --ink-3:#262936;
  --paper:#FFFFFF;
  --text:#F2F3F7;
  --dim:#9AA0B4;
  --line:rgba(255,255,255,.10);

  --g-fantasy:#00B87C;
  --g-sf:#00C2FF;
  --g-mystery:#7B4BFF;
  --g-romance:#FF3E8A;
  --g-horror:#E63946;
  --g-adventure:#F2B705;
  --g-history:#C98A3B;
  --g-business:#FF7A18;
  --g-self:#FF9F1C;
  --g-science:#1FC9C3;
  --g-kids:#A8E10C;
  --g-essay:#FF6B6B;
  --g-other:#8892A6;

  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--ui);
  overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- 共通ヘッダー ---------- */
.bar{
  flex:0 0 auto;padding:calc(var(--safe-t) + 14px) 16px 12px;
  display:flex;align-items:center;gap:10px;
  background:var(--ink);border-bottom:1px solid var(--line);
}
.bar h1{
  margin:0;font-family:var(--display);font-size:22px;letter-spacing:.06em;
  font-weight:800;
}
.bar .count{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.spacer{flex:1}
.iconbtn{
  width:40px;height:40px;border-radius:12px;background:var(--ink-3);
  display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--text);
}
.iconbtn:active{transform:scale(.94)}
.textbtn{padding:9px 14px;border-radius:999px;background:var(--ink-3);font-size:14px;font-weight:700}

/* ---------- 棚 ---------- */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tools{padding:12px 16px 4px}
.search{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--ink-2);font-size:16px;
}
.search::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--ink-3);color:var(--dim);white-space:nowrap;border:1.5px solid transparent;
}
.chip[data-on="1"]{color:#fff}
.list{padding:0 16px calc(120px + var(--safe-b))}

.card{
  display:flex;align-items:stretch;gap:0;margin-bottom:12px;
  background:var(--ink-2);border-radius:16px;overflow:hidden;
  border:1px solid var(--line);position:relative;
}
.card:active{transform:scale(.99)}
.spine{
  flex:0 0 36px;background:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;font-weight:800;line-height:1;color:rgba(0,0,0,.68);
  padding:10px 2px;overflow:hidden;
}
.spine span{display:block}
.spine span.rot{transform:rotate(90deg)}
.card .body{flex:1;min-width:0;padding:14px 14px 12px;text-align:left}
.card .t{
  font-family:var(--display);font-size:17px;font-weight:800;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.card .a{margin-top:3px;font-size:13px;color:var(--dim)}
.card .m{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em}
.track{margin-top:9px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:99px}
.more{
  flex:0 0 44px;display:grid;place-items:center;color:var(--dim);font-size:20px;
  border-left:1px solid var(--line);
}
.empty{padding:56px 24px;text-align:center;color:var(--dim);line-height:1.9}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--text);margin-bottom:10px}
.empty .ghost{max-width:320px;margin:18px auto 0}

.fab{
  position:fixed;right:18px;bottom:calc(20px + var(--safe-b));
  height:56px;padding:0 22px;border-radius:999px;background:var(--g-business);
  color:#12131A;font-family:var(--display);font-weight:900;font-size:17px;
  box-shadow:0 10px 26px rgba(255,122,24,.34);display:flex;align-items:center;gap:8px;
}
.fab:active{transform:scale(.96)}

/* ---------- 追加・編集 ---------- */
.form{padding:16px 16px calc(40px + var(--safe-b));max-width:720px;margin:0 auto;width:100%}
.label{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--dim);margin:18px 0 8px}
.label:first-child{margin-top:4px}
.input,.area{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--ink-2);font-size:16px;line-height:1.6;
}
.area{min-height:220px;resize:vertical;font-family:var(--serif)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  padding:9px 13px;border-radius:999px;background:var(--ink-3);font-size:13px;font-weight:700;
  color:var(--dim);border:1.5px solid transparent;
}
.pill[data-on="1"]{color:#12131A}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:11px;border:2.5px solid transparent}
.sw[data-on="1"]{border-color:#fff}
.hint{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:8px}
.primary{
  width:100%;margin-top:26px;padding:16px;border-radius:16px;background:var(--g-business);
  color:#12131A;font-family:var(--display);font-size:17px;font-weight:900;
}
.danger{width:100%;margin-top:12px;padding:14px;border-radius:16px;background:rgba(230,57,70,.14);color:#FF7C85;font-weight:800}
.ghost{width:100%;margin-top:12px;padding:14px;border-radius:16px;background:var(--ink-3);font-weight:800}

/* ---------- リーダー ---------- */
#reader{background:var(--rb,#12131A);color:var(--rt,#F2F3F7)}
#reader .bar{background:transparent;border-bottom-color:rgba(128,128,128,.18)}
#reader .iconbtn{background:rgba(128,128,128,.16);color:inherit}
.rtitle{font-family:var(--display);font-size:14px;font-weight:800;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;max-width:52vw}
.page{
  padding:24px 22px calc(150px + var(--safe-b));max-width:760px;margin:0 auto;width:100%;
  font-family:var(--serif);
  font-size:var(--fs,19px);line-height:var(--lh,1.85);
}
.page h2{
  font-family:var(--display);font-size:15px;letter-spacing:.14em;font-weight:800;
  color:var(--c,#FF7A18);margin:0 0 22px;text-transform:uppercase;
}
.page p{margin:0 0 1.15em;text-align:left;word-break:normal;overflow-wrap:break-word;hyphens:auto}
.foot{
  position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(to top,var(--rb,#12131A) 62%,transparent);
  display:flex;align-items:center;gap:10px;
}
.foot .nav{
  flex:0 0 auto;padding:13px 18px;border-radius:14px;background:rgba(128,128,128,.18);
  font-weight:800;font-size:15px;
}
.foot .nav[disabled]{opacity:.3}
.foot .pos{flex:1;text-align:center;font-family:var(--mono);font-size:11.5px;opacity:.7}
.rprog{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(128,128,128,.2)}
.rprog i{display:block;height:100%;background:var(--c,#FF7A18)}

/* ---------- 文字装飾 ---------- */
.mk{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mk[data-hl="1"]{--fg-red:#C62828;--fg-blue:#1565C0;color:#16171C;padding:.06em 0}
.mk[data-b="1"]{font-weight:800}
.mk[data-fg="red"]{color:var(--fg-red,#E5484D)}
.mk[data-fg="blue"]{color:var(--fg-blue,#3B82F6)}

.stylebar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;
  padding:12px 14px calc(12px + var(--safe-b));
  background:var(--ink-2);color:var(--text);font-family:var(--ui);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  box-shadow:0 -12px 34px rgba(0,0,0,.42);
  user-select:none;-webkit-user-select:none;
}
.stylebar.on{display:block}
.sbrow{display:flex;align-items:center;gap:8px}
.sbrow + .sbrow{margin-top:10px}
.sblabel{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin:12px 0 8px}
.sbtn{
  padding:10px 13px;border-radius:12px;background:var(--ink-3);
  font-weight:800;font-size:14px;color:var(--text);border:1.5px solid transparent;
}
.sbtn:active{transform:scale(.94)}
.sbtn[data-on="1"]{border-color:var(--g-business)}
.sbtn.red{color:#FF7B7B}
.sbtn.blue{color:#7BB8FF}
.sbtn.wide{flex:1}
.swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.swatches button{
  height:0;padding-bottom:100%;border-radius:9px;
  border:1.5px solid rgba(255,255,255,.20);
}
.swatches button:active{transform:scale(.9)}

/* ---------- シート ---------- */
.sheet{
  position:fixed;inset:0;display:none;z-index:50;align-items:flex-end;
  background:rgba(0,0,0,.55);
}
.sheet.on{display:flex}
.sheet .inner{
  width:100%;background:var(--ink-2);border-radius:22px 22px 0 0;
  padding:18px 18px calc(22px + var(--safe-b));color:var(--text);
}
.sheet h3{margin:0 0 14px;font-family:var(--display);font-size:17px}
.sline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sline .k{flex:0 0 92px;font-size:13px;color:var(--dim);font-weight:700}
.stepper{display:flex;gap:8px;flex:1}
.stepper button{flex:1;padding:12px;border-radius:12px;background:var(--ink-3);font-weight:800}
.sblock{margin-bottom:14px}
.sblock .k{display:block;margin-bottom:9px;font-size:13px;color:var(--dim);font-weight:700}
.sblock .k em{font-style:normal;font-size:11px;opacity:.75;margin-left:8px;font-weight:600}
.ver{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10.5px;opacity:.6}
.code{display:inline-block;margin-top:6px;padding:7px 10px;border-radius:9px;background:var(--ink-3);
  font-family:var(--mono);font-size:12px;color:var(--text);word-break:break-all;user-select:all}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:44vh;overflow-y:auto}
.themes button{
  padding:9px 3px 7px;border-radius:12px;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1;
  /* 暗い紙がシートの背景に溶けないように、内側へ細い輪郭を引く */
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.32);
}
.themes button:active{transform:scale(.94)}
.themes button[data-on="1"]{border-color:var(--g-business)}
.themes .ta{font-family:var(--serif);font-size:15px;font-weight:700}
.themes .tn{font-size:9px;opacity:.72;font-weight:700}
.toclist{max-height:52vh;overflow-y:auto;margin:0 -4px}
.toclist button{
  display:block;width:100%;text-align:left;padding:13px 12px;border-radius:12px;
  font-size:14.5px;line-height:1.5;
}
.toclist button[data-on="1"]{background:var(--ink-3);font-weight:800}
.toclist .n{font-family:var(--mono);font-size:11px;color:var(--dim);margin-right:8px}

.toast{
  position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%);
  background:#fff;color:#12131A;padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--g-sf);outline-offset:2px}
</style>
</head>
<body>

<!-- ============ 棚 ============ -->
<section id="shelf" class="view on">
  <header class="bar">
    <h1>BOOKSHELF</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnData" aria-label="バックアップ">⇅</button>
  </header>
  <div class="scroll">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="タイトル・著者で検索">
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </div>
  <button class="fab" id="btnAdd">＋ 本を追加</button>
</section>

<!-- ============ 追加・編集 ============ -->
<section id="edit" class="view">
  <header class="bar">
    <button class="iconbtn" id="editBack" aria-label="戻る">←</button>
    <h1 id="editTitle" style="font-size:18px">本を追加</h1>
  </header>
  <div class="scroll">
    <div class="form">
      <div class="label">タイトル</div>
      <input class="input" id="fTitle" placeholder="The Thursday Murder Club">

      <div class="label">著者（空でもOK）</div>
      <input class="input" id="fAuthor" placeholder="Richard Osman">

      <div class="label">本文</div>
      <textarea class="area" id="fText" placeholder="ここに本文を貼り付け、または入力します。長さの制限はありません。"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="pill" id="btnPaste" style="color:var(--text)">クリップボードから貼り付け</button>
        <button class="pill" id="btnFile" style="color:var(--text)">.txt を読み込む</button>
      </div>
      <input type="file" id="fileIn" accept=".txt,text/plain" hidden>
      <div class="hint" id="stat">0 語</div>

      <div class="label">ジャンル<span id="autoTag" style="color:var(--g-business);margin-left:8px"></span></div>
      <div class="row" id="genres"></div>

      <div class="label">ラベルの色</div>
      <div class="swatches" id="colors"></div>
      <div class="hint">色は指定しなければジャンルの色になります。</div>

      <button class="primary" id="btnSave">棚に入れる</button>
      <button class="danger" id="btnDelete" hidden>この本を削除</button>
    </div>
  </div>
</section>

<!-- ============ リーダー ============ -->
<section id="reader" class="view">
  <header class="bar">
    <button class="iconbtn" id="rBack" aria-label="棚へ戻る">←</button>
    <span class="rtitle" id="rTitle"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnToc" aria-label="目次">☰</button>
    <button class="iconbtn" id="btnAa" aria-label="表示設定">Aa</button>
  </header>
  <div class="scroll" id="rScroll">
    <div class="page" id="page"></div>
  </div>
  <div class="foot">
    <button class="nav" id="prev">‹ 前</button>
    <span class="pos" id="pos"></span>
    <button class="nav" id="next">次 ›</button>
  </div>
  <div class="rprog"><i id="rbar"></i></div>

  <div class="stylebar" id="styleBar">
    <div class="sbrow">
      <button class="sbtn" id="sbBold"><b>B</b> 太字</button>
      <button class="sbtn red" id="sbRed">赤字</button>
      <button class="sbtn blue" id="sbBlue">青字</button>
      <span class="spacer"></span>
      <button class="sbtn" id="sbClose" aria-label="閉じる">✕</button>
    </div>
    <div class="sblabel">文字の背景色</div>
    <div class="swatches" id="sbColors"></div>
    <div class="sbrow">
      <button class="sbtn wide" id="sbNoBg">背景をなくす</button>
      <button class="sbtn wide" id="sbClear">すべて解除</button>
    </div>
  </div>
</section>

<!-- ============ シート ============ -->
<div class="sheet" id="sheetAa"><div class="inner">
  <h3>表示設定</h3>
  <div class="sline"><span class="k">文字の大きさ</span><div class="stepper">
    <button data-fs="-1">小さく −</button><button data-fs="1">大きく ＋</button></div></div>
  <div class="sline"><span class="k">行の間隔</span><div class="stepper">
    <button data-lh="-1">狭く −</button><button data-lh="1">広く ＋</button></div></div>
  <div class="sblock">
    <span class="k">背景の紙<em>この本だけに保存されます</em></span>
    <div class="themes" id="themes"></div>
  </div>
  <button class="ghost" data-close="1">閉じる</button>
</div></div>

<div class="sheet" id="sheetToc"><div class="inner">
  <h3>目次</h3>
  <div class="toclist" id="toc"></div>
  <button class="ghost" data-close="1">閉じる</button>
</div></div>

<div class="sheet" id="sheetMore"><div class="inner">
  <h3 id="moreTitle"></h3>
  <button class="ghost" id="mEdit">編集する</button>
  <button class="ghost" id="mReset">読んだ位置をリセット</button>
  <button class="ghost" data-close="1">閉じる</button>
</div></div>

<div class="sheet" id="sheetData"><div class="inner">
  <h3>同期とバックアップ</h3>

  <div class="sblock">
    <span class="k">ほかの端末と同期<em id="syncState"></em></span>
    <div id="syncOff">
      <input class="search" id="syncTok" type="password" placeholder="GitHub トークンを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input class="search" id="syncGid" placeholder="同期コード（2台目だけ入力）" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:8px">
      <button class="ghost" id="syncStart">同期を始める</button>
      <div class="hint">1台目は同期コードを空のままにしてください。表示されたコードを2台目に入れると、同じ本棚になります。</div>
    </div>
    <div id="syncOn" hidden>
      <div class="hint">同期コード<br><code id="syncCode" class="code"></code></div>
      <button class="ghost" id="syncNow">いま同期する</button>
      <button class="ghost" id="syncStop">同期をやめる</button>
    </div>
  </div>

  <button class="ghost" id="dExport">全部を書き出す（.json）</button>
  <button class="ghost" id="dImport">読み込む（.json）</button>
  <input type="file" id="jsonIn" accept="application/json,.json" hidden>
  <div class="hint">本は端末の中だけに保存されます。ブラウザやアプリごとに保存場所が分かれることがあるので、
  ホーム画面に追加した直後や機種変更の前に、いちど書き出しておくと安心です。装飾と背景の紙も一緒に保存されます。
  <br><span id="appVer" class="ver"></span></div>
  <button class="ghost" data-close="1">閉じる</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const APP_VER = "2026-08-22 同期対応";   // どの版が動いているか確かめるための表示

/* ============ ジャンル定義 ============ */
const GENRES = [
  {id:"fantasy",  name:"ファンタジー", c:"#00B87C", kw:["wizard","magic","dragon","elf","sword","spell","kingdom","witch","quest","prophecy","sorcer","enchant","goblin","mage","realm","castle"]},
  {id:"sf",       name:"SF",          c:"#00C2FF", kw:["space","robot","alien","galaxy","planet","spaceship","android","cyber","laser","starship","quantum","colony","mars","orbit","artificial intelligence"]},
  {id:"mystery",  name:"ミステリー",   c:"#7B4BFF", kw:["murder","detective","clue","suspect","inspector","crime","victim","alibi","investigat","police","mystery","witness","sergeant","evidence"]},
  {id:"romance",  name:"ロマンス",     c:"#FF3E8A", kw:["love","kiss","romance","marry","wedding","boyfriend","girlfriend","darling","passion","dating","affair","heart"]},

/* ============ 保存 (IndexedDB) ============ */
const DB = (()=>{
  let p=null;
  function open(){
    if(p) return p;
    p = new Promise((res,rej)=>{
      const r = indexedDB.open("bookshelf",1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("books",{keyPath:"id"}); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    });
    return p;
  }
  const tx = (mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t = db.transaction("books",mode);
    const s = t.objectStore("books");
    const req = fn(s);
    t.oncomplete = ()=>res(req && req.result);
    t.onerror = ()=>rej(t.error);
  }));
  return {
    all: ()=>tx("readonly",s=>s.getAll()),
    put: b=>tx("readwrite",s=>s.put(b)),
    del: id=>tx("readwrite",s=>s.delete(id)),
  };
})();

function isDark(hex){
  const c=hex.replace("#","");
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 128;
}

/* ============ ジャンル自動判定 ============ */
function detectGenre(title,text){
  const src = ((title||"")+" "+(text||"").slice(0,20000)).toLowerCase();
  if(!src.trim()) return "other";
  let best="other", bestScore=0;
  for(const g of GENRES){
    if(!g.kw.length) continue;
    let n=0;
    for(const k of g.kw){
      const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g");
      const m = src.match(re);
      if(m) n += Math.min(m.length,12);
    }
    const score = n / Math.sqrt(g.kw.length);
    if(score>bestScore){bestScore=score;best=g.id;}
  }
  return bestScore>=2 ? best : "other";
}

/* ============ 本文の分割 ============ */
const HEAD = /^(chapter|chap\.?|part|prologue|epilogue|book|section)\b[\s.:—-]*[0-9ivxlcdm]*\.?\s*$/i;
const HEAD2 = /^(chapter|part|prologue|epilogue)\b/i;

function splitParts(text){
  const paras = (text||"").replace(/\r/g,"").split(/\n\s*\n+/)
    .map(s=>s.trim()).filter(Boolean);
  if(!paras.length) return [{title:"本文",paras:["（本文がありません）"]}];

  const heads = paras.filter(p=>p.length<70 && (HEAD.test(p)||HEAD2.test(p)));
  let out=[];
  if(heads.length>=2){
    let curP=null;
    paras.forEach((p,i)=>{
      const isH = p.length<70 && (HEAD.test(p)||HEAD2.test(p));
      if(isH || !curP){
        curP={title:isH?p:"はじめ",paras:[]};
        out.push(curP);
        if(isH) return;
      }
      curP.paras.push(p);
    });
  }else{
    out=[{title:"",paras:paras.slice()}];
  }
  // 長すぎるパートはさらに分ける（表示を軽くするため）
  const LIMIT=1400, res=[];
  for(const p of out){
    let buf=[],n=0,seg=0;
    for(const t of p.paras){
      buf.push(t); n+=words(t);
      if(n>=LIMIT){
        seg++;
        res.push({title:p.title?(seg>1?p.title+" ("+seg+")":p.title):"",paras:buf});
        buf=[];n=0;
      }
    }
    if(buf.length){
      seg++;
      res.push({title:p.title?(seg>1?p.title+" ("+seg+")":p.title):"",paras:buf});
    }
  }
  return res.map((p,i)=>({title:p.title||("パート "+(i+1)),paras:p.paras}));
}

/* --- 段落の描画（装飾つき） --- */
function paintPara(el,text){
  const runs = (cur && cur.marks && cur.marks[el.dataset.gi]) || [];
  const L = text.length;
  el.textContent = "";
  let pos = 0;
  for(const r of runs){
    const s = Math.max(0,Math.min(L,r.s|0)), e = Math.max(0,Math.min(L,r.e|0));
    if(e<=s || s<pos) continue;                       // 壊れた範囲は読み飛ばす
    if(s>pos) el.appendChild(document.createTextNode(text.slice(pos,s)));
    const sp = document.createElement("span");
    sp.className = "mk";
    if(r.bg){ sp.style.background = r.bg; sp.dataset.hl = "1"; }
    if(r.bold) sp.dataset.b = "1";
    if(r.fg) sp.dataset.fg = r.fg;
    sp.textContent = text.slice(s,e);
    el.appendChild(sp);
    pos = e;
  }
  if(pos<L) el.appendChild(document.createTextNode(text.slice(pos)));
}
function repaint(gis){
  gis.forEach(gi=>{
    const el = $('#page p[data-gi="'+gi+'"]');
    if(el) paintPara(el, el.textContent);
  });
}

/* --- 範囲の足し引き（重なっても崩れないように区間で持つ） --- */
function splitAt(runs,x){
  const out=[];
  for(const r of runs){
    if(r.s<x && x<r.e){ out.push({...r,e:x},{...r,s:x}); }
    else out.push(r);
  }
  return out;
}
function applyRange(runs,s,e,patch){
  if(e<=s) return runs;
  const cut = splitAt(splitAt(runs.map(r=>({...r})),s),e).sort((a,b)=>a.s-b.s);
  const inside = cut.filter(r=>r.s>=s && r.e<=e);
  const outside = cut.filter(r=>!(r.s>=s && r.e<=e));
  const target=[]; let pos=s;
  for(const r of inside){                              // 装飾のない隙間を埋める
    if(r.s>pos) target.push({s:pos,e:r.s,bg:null,bold:0,fg:null});
    target.push(r); pos=r.e;
  }
  if(pos<e) target.push({s:pos,e:e,bg:null,bold:0,fg:null});
  target.forEach(r=>Object.assign(r,patch));

  const all = outside.concat(target).sort((a,b)=>a.s-b.s)
    .filter(r=>r.e>r.s && (r.bg||r.bold||r.fg));
  const merged=[];                                     // 同じ装飾が隣り合ったらつなぐ
  for(const r of all){
    const p = merged[merged.length-1];
    if(p && p.e===r.s && p.bg===r.bg && p.bold===r.bold && p.fg===r.fg) p.e=r.e;
    else merged.push(r);
  }
  return merged;
}

/* --- 選択範囲を「段落の通し番号 + 文字位置」に置き換える --- */
function readSel(){
  const sel = document.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const page = $("#page");
  if(!page.contains(range.commonAncestorContainer)) return null;
  const out=[];
  $$("#page p[data-gi]").forEach(p=>{
    if(!range.intersectsNode(p)) return;
    const full = document.createRange(); full.selectNodeContents(p);
    const r = range.cloneRange();
    if(r.compareBoundaryPoints(Range.START_TO_START,full)<0) r.setStart(full.startContainer,full.startOffset);
    if(r.compareBoundaryPoints(Range.END_TO_END,full)>0)     r.setEnd(full.endContainer,full.endOffset);
    const head = document.createRange();
    head.setStart(full.startContainer,full.startOffset);
    head.setEnd(r.startContainer,r.startOffset);
    const s = head.toString().length;
    const e = s + r.toString().length;
    if(e>s) out.push({gi:+p.dataset.gi, s, e});
  });
  return out.length?out:null;
}
function posInPara(el,off){
  const w = document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let acc=0,n,last=null;
  while((n=w.nextNode())){
    if(off<=acc+n.nodeValue.length) return {node:n,off:off-acc};
    acc+=n.nodeValue.length; last=n;
  }
  return last?{node:last,off:last.nodeValue.length}:{node:el,off:0};
}
function restoreSel(){
  if(!selTargets.length) return;
  const f=selTargets[0], l=selTargets[selTargets.length-1];
  const pa=$('#page p[data-gi="'+f.gi+'"]'), pb=$('#page p[data-gi="'+l.gi+'"]');
  if(!pa||!pb) return;
  const a=posInPara(pa,f.s), b=posInPara(pb,l.e);
  try{
    const r=document.createRange();
    r.setStart(a.node,a.off); r.setEnd(b.node,b.off);
    const sel=document.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(err){}
}

/* --- 選択範囲がすでにその装飾かどうか（押すたびに入 / 切） --- */
function selHasAll(test){
  if(!selTargets.length) return false;
  return selTargets.every(t=>{
    const runs = ((cur&&cur.marks&&cur.marks[t.gi])||[]).slice().sort((a,b)=>a.s-b.s);
    let pos=t.s;
    for(const r of runs){
      if(r.e<=pos) continue;
      if(r.s>pos || !test(r)) return false;
      pos=r.e;
      if(pos>=t.e) return true;
    }
    return pos>=t.e;
  });
}

/* 装飾・背景など、いま読んでいる本の変更をまとめて保存する */
function saveCur(){
  if(!cur) return;
  touch(cur);
  clearTimeout(markTimer);
  markTimer = setTimeout(()=>{DB.put(cur).catch(()=>toast("保存できませんでした"));SYNC.later();},300);
}
function applyStyle(patch){
  if(!cur || !selTargets.length) return;
  cur.marks = cur.marks || {};
  for(const t of selTargets){
    const runs = applyRange(cur.marks[t.gi]||[], t.s, t.e, patch);
    if(runs.length) cur.marks[t.gi]=runs; else delete cur.marks[t.gi];
  }
  saveCur();
  repaint(selTargets.map(t=>t.gi));
  restoreSel();
  updateBarState();
}

/* ============ 同期（GitHub の非公開 Gist を保管庫にする） ============
   ・本 1 冊 = ファイル 1 つ。まとめて 1 ファイルにすると容量制限に当たるため
   ・index.json に「どの本がいつ更新されたか」だけ置き、差分だけやり取りする
   ・同じ本が両方で変わっていたら、更新時刻が新しい方を採用する          */
const SYNC = (()=>{
  const API="https://api.github.com";
  const IDX="index.json";
  const fileOf = id=>"b-"+id+".json";
  const get = k=>localStorage.getItem(k)||"";
  const set = (k,v)=>{ v?localStorage.setItem(k,v):localStorage.removeItem(k); };

  let running=false, timer=null;
  const on = ()=> !!(get("syncToken") && get("syncGist"));

  async function call(path,opt){
    const r = await fetch(API+path, Object.assign({
      headers:{ "Authorization":"Bearer "+get("syncToken"),
                "Accept":"application/vnd.github+json",
                "Content-Type":"application/json" }
    }, opt||{}));
    if(r.status===401) throw new Error("トークンが正しくないようです");
    if(r.status===403) throw new Error("トークンに gist の権限がないようです");
    if(r.status===404) throw new Error("同期コードが見つかりません");
    if(!r.ok) throw new Error("通信に失敗しました（"+r.status+"）");
    return r.json();
  }
  // 1MB を超えるファイルは中身が省略されて返るので、その場合は実体を取りに行く
  async function body(f){
    if(!f) return null;
    if(!f.truncated) return f.content;
    const r = await fetch(f.raw_url);
    if(!r.ok) throw new Error("本文を取得できませんでした");
    return r.text();
  }

  async function localAll(){ return (await DB.all())||[]; }
  const stamp = r=>r.updated||r.lastRead||r.created||1;

  async function run(strict){
    if(!on() || running) return false;
    running=true; paint("同期中…");
    try{
      const gist = await call("/gists/"+get("syncGist"));
      const files = gist.files||{};
      const remoteIdx = files[IDX] ? JSON.parse(await body(files[IDX])) : {};

      const local = await localAll();
      const localMap = {}; local.forEach(r=>localMap[r.id]=r);

      const ids = new Set([...Object.keys(localMap), ...Object.keys(remoteIdx)]);
      const pushFiles = {};          // こちらが新しい → 送る
      const pullIds = [];            // 向こうが新しい → 取り込む
      const nextIdx = {};

      for(const id of ids){
        const L=localMap[id], R=remoteIdx[id];
        const lt=L?stamp(L):0, rt=R?(R.updated||0):0;
        if(rt>lt){ pullIds.push(id); nextIdx[id]={updated:rt,deleted:R.deleted?1:0}; }
        else if(L){ pushFiles[fileOf(id)]={content:JSON.stringify(L)};
                    nextIdx[id]={updated:lt,deleted:L.deleted?1:0}; }
      }

      // 取り込み
      let got=0;
      for(const id of pullIds){
        const txt = await body(files[fileOf(id)]);
        if(txt==null) continue;
        const rec = JSON.parse(txt);
        rec.id=id; if(!rec.updated) rec.updated=nextIdx[id].updated;
        await DB.put(rec); got++;
      }
      // 送り出し（index は毎回まとめて更新する）
      const changed = Object.keys(pushFiles).length;
      if(changed || JSON.stringify(remoteIdx)!==JSON.stringify(nextIdx)){
        pushFiles[IDX]={content:JSON.stringify(nextIdx)};
        await call("/gists/"+get("syncGist"),{method:"PATCH",body:JSON.stringify({files:pushFiles})});
      }

      if(got){                        // 取り込んだものを画面へ
        books = ((await DB.all())||[]).filter(r=>!r.deleted);
        books.forEach(b=>{ if(b.words==null) b.words=words(b.text); });
        renderChips(); renderList();
        if(cur){ const f=books.find(b=>b.id===cur.id); if(f && f!==cur) cur=f; }
      }
      set("syncAt",String(Date.now()));
      paint(got?(got+"冊を受け取りました"):"同期しました");
      return true;
    }catch(e){
      paint(e.message||"同期できませんでした");
      if(strict) throw e;              // 接続のときは理由をそのまま伝える
      return false;
    }finally{ running=false; }
  }

  function later(){ if(!on()) return; clearTimeout(timer); timer=setTimeout(run,2500); }

  async function connect(token,gid){
    set("syncToken",token);
    if(gid){ set("syncGist",gid); }
    else{
      const g = await call("/gists",{method:"POST",body:JSON.stringify({
        description:"BOOKSHELF の本棚（このファイルは消さないでください）",
        public:false, files:{[IDX]:{content:"{}"}}
      })});
      set("syncGist",g.id);
    }
    await run(true);
    return get("syncGist");
  }
  function disconnect(){ set("syncToken",""); set("syncGist",""); set("syncAt",""); }

  function paint(msg){
    const s=$("#syncState"); if(s && msg) s.textContent=msg;
    const box=$("#sheetData"); if(!box) return;
    $("#syncOff").hidden = on();
    $("#syncOn").hidden  = !on();
    if(on()) $("#syncCode").textContent = get("syncGist");
  }
  return {on,run,later,connect,disconnect,paint,code:()=>get("syncGist")};
})();

/* ============ バックアップ ============ */
function download(name,text,type){
  const blob=new Blob([text],{type:type||"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}

/* ============ イベント ============ */
$("#btnAdd").onclick=()=>openEditor(null);
$("#editBack").onclick=()=>{show("shelf");applyReaderStyle();};
$("#rBack").onclick=()=>{hideStyleBar();show("shelf");renderChips();renderList();applyReaderStyle();};
$("#btnSave").onclick=saveBook;
$("#btnDelete").onclick=async()=>{
  if(!editingId) return;
  if(!confirm("この本を削除します。元に戻せません。")) return;
  // 消した印だけ残す。これが無いと、同期のたびに他の端末から本が戻ってきてしまう
  await DB.put({id:editingId, deleted:1, updated:Date.now()});
  books=books.filter(b=>b.id!==editingId);
  renderChips(); renderList(); show("shelf"); toast("削除しました");
  SYNC.later();
};
$("#fText").addEventListener("input",updateStat);
$("#fTitle").addEventListener("input",()=>{ if(!fGenre){autoG=detectGenre($("#fTitle").value,$("#fText").value);renderGenrePills();renderColors();} });
$("#btnPaste").onclick=async()=>{
  try{
    const t=await navigator.clipboard.readText();
    if(!t){toast("クリップボードが空です");return;}
    const a=$("#fText"); a.value = a.value ? a.value+"\n\n"+t : t;
    updateStat(); toast("貼り付けました");
  }catch(e){ toast("長押しして「ペースト」を使ってください"); }
};
$("#btnFile").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    $("#fText").value=r.result;
    if(!$("#fTitle").value) $("#fTitle").value=f.name.replace(/\.txt$/i,"");
    updateStat(); toast("読み込みました");
  };
  r.readAsText(f);
  e.target.value="";
};
$("#q").addEventListener("input",e=>{query=e.target.value;renderList();});

$("#prev").onclick=()=>move(-1);
$("#next").onclick=()=>move(1);
$("#btnToc").onclick=()=>{renderToc();openSheet("sheetToc");};
$("#btnAa").onclick=()=>openSheet("sheetAa");
$$("[data-fs]").forEach(b=>b.onclick=()=>{
  S.fs=Math.min(30,Math.max(14,S.fs+ (+b.dataset.fs)*1));
  localStorage.setItem("fs",S.fs); applyReaderStyle();
});
$$("[data-lh]").forEach(b=>b.onclick=()=>{
  S.lh=Math.min(2.6,Math.max(1.3,+(S.lh+(+b.dataset.lh)*0.1).toFixed(2)));
  localStorage.setItem("lh",S.lh); applyReaderStyle();
});
$("#mEdit").onclick=()=>{closeSheets();openEditor(moreId);};
$("#mReset").onclick=async()=>{
  const b=books.find(x=>x.id===moreId);
  b.part=0;b.progress=0;await DB.put(touch(b));
  closeSheets();renderList();toast("最初に戻しました");SYNC.later();
};
$("#btnData").onclick=()=>{openSheet("sheetData");SYNC.paint(SYNC.on()?"":"まだ設定されていません");};
$("#syncStart").onclick=async()=>{
  const tok=$("#syncTok").value.trim(), gid=$("#syncGid").value.trim();
  if(!tok){ toast("トークンを貼り付けてください"); return; }
  const btn=$("#syncStart"); btn.disabled=true; SYNC.paint("接続中…");
  try{
    await SYNC.connect(tok,gid);
    $("#syncTok").value=""; $("#syncGid").value="";
    toast("同期を始めました");
  }catch(e){
    SYNC.disconnect(); SYNC.paint(e.message||"接続できませんでした");
    toast(e.message||"接続できませんでした");
  }finally{ btn.disabled=false; SYNC.paint(); }
};
$("#syncNow").onclick=async()=>{ await SYNC.run(); };
$("#syncStop").onclick=()=>{
  if(!confirm("この端末の同期を止めます。本はこの端末に残ります。")) return;
  SYNC.disconnect(); SYNC.paint("同期をやめました"); toast("同期をやめました");
};
// 別の端末で足された本を、戻ってきたときに拾う
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) SYNC.later(); });
$("#dExport").onclick=()=>{
  download("bookshelf-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(books));
  toast("書き出しました");
};
$("#dImport").onclick=()=>$("#jsonIn").click();
$("#jsonIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr)) throw 0;
      for(const b of arr){
        if(!b.id||!b.title) continue;
        b.words=b.words||words(b.text);
        if(!b.updated) touch(b);
        await DB.put(b);
        books=books.filter(x=>x.id!==b.id); books.push(b);
      }
      renderChips();renderList();closeSheets();toast(arr.length+"冊を読み込みました");
      SYNC.later();
    }catch(err){ toast("このファイルは読み込めません"); }
  };
  r.readAsText(f);
  e.target.value="";
};

document.addEventListener("keydown",e=>{
  if(!$("#reader").classList.contains("on")) return;
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
});

/* ============ PWA ============ */
/* アイコンとマニフェストは実ファイル（head の link）で読み込む。
   data: や blob: の URL は iOS がホーム画面のアイコンとして読めないため。 */

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ============ 起動 ============ */
(async function init(){
  try{
    // 消した印（tombstone）は棚に出さない
    books = ((await DB.all()) || []).filter(r=>!r.deleted);
  }catch(e){
    books=[]; toast("保存領域を開けませんでした");
  }
  books.forEach(b=>{ if(b.words==null) b.words=words(b.text); if(!b.updated) b.updated=b.lastRead||b.created||1; });
  renderThemes();
  applyReaderStyle();
  renderChips();
  renderList();
  $("#appVer").textContent = "版：" + APP_VER;
  if(SYNC.on()) SYNC.run();      // 起動時にほかの端末の変更を取り込む
})();
</script>
